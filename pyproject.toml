[project]
name = "sinhalalm-web-convert"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["convert"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
