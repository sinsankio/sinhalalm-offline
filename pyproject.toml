[project]
name = "sinhalalm-web-convert"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub==0.36.2",
    "numpy==2.5.4",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "transformers==4.57.6",
]

[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.uv]
package = false
exclude-newer = "2026-10-22T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["convert"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
